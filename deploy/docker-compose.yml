
# PRODUCTION single-node stack: Dokploy (Traefik) + Tilework + LiveKit.
# Dokploy handles automatic HTTPS and reverse proxy.
#
# 1) Configure deploy/.env or Dokploy environment variables.
# 2) Configure office and LiveKit domains in Dokploy.
# 3) Deploy the Compose project.
# 4) Create admin invite:
#    /app/tilework -invite admin

name: tilework

services:
  tilework:
    image: "${TILEWORK_IMAGE:-ghcr.io/guhcostan/tilework:latest}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped

    environment:
      TILEWORK_ENV: production
      TILEWORK_ADDR: ":18080"
      TILEWORK_DB: "${TILEWORK_DB:-/data/tilework.db}"
      TILEWORK_ALLOWED_ORIGINS: "${APP_DOMAIN:?set APP_DOMAIN}"
      TILEWORK_OFFICE_NAME: "${OFFICE_NAME:-Office}"
      TILEWORK_METRICS_TOKEN: "${METRICS_TOKEN:-}"

      # Public sandbox
      TILEWORK_DEMO: "${DEMO:-}"
      TILEWORK_DEMO_RESET_HOURS: "${DEMO_RESET_HOURS:-6}"

      TILEWORK_MAX_PLAYERS: "${MAX_PLAYERS:-2000}"
      TILEWORK_SESSION_DAYS: "${SESSION_DAYS:-30}"

      # LiveKit connection
      LIVEKIT_URL: "wss://${LIVEKIT_DOMAIN:?set LIVEKIT_DOMAIN}"
      LIVEKIT_API_URL: http://livekit:7880
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET (>= 32 chars)}"

    volumes:
      - tilework-data:/data

    healthcheck:
      test: ["CMD", "/app/tilework", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3

    expose:
      - "18080"

    depends_on:
      - livekit

  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped

    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        turn:
          enabled: true
          domain: ${LIVEKIT_DOMAIN}
          udp_port: 3478
          external_tls: false

    ports:
      - "7881:7881"
      - "7882:7882/udp"
      - "3478:3478/udp"

    expose:
      - "7880"

volumes:
  tilework-data:
    name: "${TILEWORK_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-tilework}_tilework-data}"
